  }).filter(e => e && e.ts && e.content);

  /* 问一位成员(游标制): 桥算增量(只给他没见过的) → 流式展示 → 送达 markSeen(失败不动游标, 重问不丢话) → 回复入档按成员署名 */
  /* 会话档单条追加: 当前会话走内存 _histCache 同步 push(消除"各自 S.get 拿旧基线→并发覆盖丢消息"), 非当前会话(切走)才读存储写 */
  async function appendHist(sc, entry) {
    if (sc === curSession) { _histCache.push(entry); await S.set(chatKey(sc), _histCache.slice(-200)); return; }

  async function askMember(target, sc) { // sc=发起会话(互动/切会话下与 curSession 解绑, 不串味); 返回是否真发言(供互动跳过沉默)
    sc = sc || curSession;
    const gen = _clearGen; // 本次发言世代: 期间发生全清则作废(不 markSeen/不入档)
    const br = bridge();
    const el = appendMsg(target.name, '…', 'assistant');
    const d = br.takeDelta(sc, target.id, _roomEntries(target.id));
    if (!d.count) { el.querySelector('.msg-body').textContent = '(没有他未读的新消息, 未发送)'; return false; }
    let acc = '', ok = false, cut = false;
    try {
      for await (const ev of br.chatWithMember(target.bridgeId, target.id, d.text, { scope: sc })) {
        if (_stop) { cut = true; break; } // 停止/全清: 掐断当前成员流(与引擎同款可停)
        if (ev.delta) { acc += ev.delta; el.querySelector('.msg-body').textContent = acc; chatScroll(); }
      }
      ok = true;
      if (!acc) el.querySelector('.msg-body').textContent = '(对方没有回复内容)';
    } catch (e) { el.querySelector('.msg-body').textContent = (acc ? acc + '\n' : '') + '✗ ' + e.message; }
    if (cut || gen !== _clearGen) return false; // 被打断/期间全清: 半句丢弃, 不 markSeen(重问不丢上文)、不入档(全清后不留残条)
    if (ok || acc) br.markSeen(sc, target.id, d.upTo);
    if (acc) { try { await appendHist(sc, { role: 'assistant', content: '[' + target.name + '] ' + acc, author: target.id, authorName: target.name, ts: _tsNow() }); } catch (e) { } }
    return !!acc;
  }
  /* 用户点名一位成员: 用户消息先入档(房间事实先行, delta 才拿得到这条) → askMember */
  async function sendToMember(target, text) {
    try { await appendHist(curSession, { role: 'user', content: text, to: target.id, toName: target.name, ts: _tsNow() }); } catch (e) { }
    appendMsg('你 → ' + target.name, text, 'user');
    await askMember(target);
    await renderTranscript(true);
    idle();
    maybeRelay(); // @某人后, 互动开着则从这位之后按序轮流接话
  }

  /* ════ 多会话(chat.sessions / chat.currentSession / chat.transcript.<sid>) ════ */
  let sessions = [{ id: 'main', name: '默认会话' }], curSession = 'main';
  const chatKey = sid => 'chat.transcript.' + sid;
  async function loadSessions() {
    sessions = await S.get('chat.sessions', sessions);
    curSession = await S.get('chat.currentSession', 'main');
    if (!sessions.find(s => s.id === curSession)) curSession = sessions[0].id;
    $('sess-name').textContent = (sessions.find(s => s.id === curSession) || {}).name || '默认会话';
    try {   // 启动兜底: 上次会话遗留的 running 活行统一标记中断 — 无论何种停摆根因, 重开后绝不谎称在跑
      const hist = await S.get(chatKey(curSession), []);
      let dirty = false;
      for (const m of hist) if (m && m.role === 'trace' && m.status === 'running') { m.status = 'error'; m.ok = false; m.label = (m.label || '') + ' — ⚠ 上次会话中断'; dirty = true; }
      if (dirty) await S.set(chatKey(curSession), hist);
    } catch (e) { }
    lockTarget = null; _inputPlaceholder(); // 锁定连聊是会话内瞬态, 切会话即解
    // 互动状态按 scope 归桥, 切会话自然读新会话的(无需手动重置); 运行中的循环绑定发起时 scope, 切走自然收尾
    try { syncGroupUI(); renderAtRow(); syncRelayBtn(); } catch (e) { }

  const saveSessions = () => Promise.all([S.set('chat.sessions', sessions), S.set('chat.currentSession', curSession)]);
  let _histCache = [];   // 内存镜像: engine push, 重绘读它
  let _streamAnswer = ''; // 最终回答的临时流式气泡(单份)。onD 边流边填, 见工具块即清, 最终轮交持久化前清 → 永不与正式并存
  let _streamEl = null;  // 流式气泡的 .msg-body 引用: 纯文字增量走快path原地更新, 不整列重建(重建=媒体高度反复塌陷=抖)
  let _interrupts = [];   // 运行中插话队列。busy 时 send 入队, engine 每轮顶端 drainInterrupts 吸收
  let _stop = false;      // 停止当前轮: 运行中工具链头⏹按钮置位, engine 在各安全点 break(防失控长跑)
  let _turnAbort = null;  // 当前轮流式请求的取消器: 停止/插话即时掐断 fetch/reader, 不等下一个 chunk

  const _txt = c => typeof c === 'string' ? c : ((Array.isArray(c) ? (c.find(p => p.type === 'text') || {}).text : '') || '[附件]');
  let _chainSeq = 0;   // 链序号(记展开态)
  const _chainOpen = {};
  function requestStop(btn) { if (!busy || _stop) return; _stop = true; if (_turnAbort) { try { _turnAbort.abort(); } catch (e) {} } if (btn) { btn.textContent = '⏹…'; btn.disabled = true; } } // 置位 + 立即掐断当前流式请求, engine 在各安全点收尾结束本轮
  function makeChain(traces, running) {   // 折叠链: 头部 + body 收纳 trace 行
    const key = 'c' + (_chainSeq++);

    const box = document.createElement('div'); box.className = 'agent-chain' + (open ? ' open' : '');

    box.innerHTML = '<div class="chain-head">' + head

    box.querySelector('.chain-head').onclick = () => { box.classList.toggle('open'); _chainOpen[key] = box.classList.contains('open'); };
    if (running) { const sb = box.querySelector('.chain-stop'); if (sb) sb.onclick = e => { e.stopPropagation(); requestStop(sb); }; }

  async function renderTranscript(reload) {
    if (reload) _histCache = await S.get(chatKey(curSession), []);
    const conv = $('agent-convo'); conv.innerHTML = ''; _chainSeq = 0;
    // 一轮一链(按 turnId 缝合): 提问气泡→工具链折叠→最终回答(该轮最后一条非 toolTurn 的 assistant, 剥工具块)。
    // 在场即共享: 房间记录全量展示, 无过滤视图
    const H = _histCache;
    const n = H.length;
    const isPrompt = m => m.role === 'user' && !String(_txt(m.content)).startsWith('工具结果') && !String(_txt(m.content)).startsWith('[系统]');
    const proseOf = m => String(m.content).replace(/```tool[\s\S]*?```/g, '').trim();
    const emitChain = tr => { if (tr.length) conv.appendChild(makeChain(tr, tr.some(t => statusOf(t) === 'running'))); };
    let i = 0;
    while (i < n) {
      const tid = H[i].turnId;

        let userMsg = null, lastAssist = null; const traces = []; let j = i;
        for (; j < n && H[j].turnId === tid; j++) { const x = H[j];

          else if (isPrompt(x)) { if (userMsg == null) userMsg = x; }
          else if (x.role === 'assistant' && !x.toolTurn) lastAssist = x; // 最终回答=该轮最后一条【未触发工具】的assistant; 工具阶段过渡(toolTurn)不进会话
        }
        if (userMsg != null) appendUserMsg(userMsg);
        emitChain(traces);
        const answer = lastAssist ? proseOf(lastAssist) : '';
        if (answer) appendMsg('全能 agent', answer, 'assistant');
        i = j;
      } else { const m = H[i++];
        if (m.role === 'member') appendMsg(m.authorName || 'bridge agent', _txt(m.content), 'member');
        else if (isPrompt(m)) appendUserMsg(m);
        else if (m.role === 'assistant') { // 成员回复(author 字段)按成员署名, 其余才是全能 agent
          const nm = m.authorName; const p = proseOf(m);

        }
      }
    }
    _streamEl = _streamAnswer ? appendMsg('全能 agent', _streamAnswer, 'assistant').querySelector('.msg-body') : null; // 流式期间的临时回答气泡; 当前轮持久 assistant 尚未入 hist, 不会与正式并存; 引用留给快path原地更新

  }

  $('sess-condense').onclick = async e => { // 手动压缩(🗜): 与引擎被动压缩共用 condense; busy 时不抢档

  /* ════ 群聊成员胶囊(内置 + bridge 在线成员): 点击=参与/退出群聊; 全能 agent 常驻不可退 — 与独立页同一交互 ════ */

    for (const k of Object.keys(FS)) { try { const cur = await ctx.kv.get(k); if (!cur || (FS[k].v !== undefined && cur.v !== FS[k].v)) await ctx.kv.set(k, FS[k]); } catch (e) { } } // 版本式: 带 v 的条目随块升级重播, 不带 v 保持种一次(用户可改)

  /* ════ 消息/步骤渲染(appendMsg/appendUserMsg/appendStep) + [[show:]] 出屏 ════
     [[show:<地址>]] 写在回答正文里, 渲染时原地变媒体/卡片; 地址复用四原语地址族(kv key 裸写即可/miniapp:<id>/fs:<路径>)。
     字节只在渲染时取(_showCache 防流式重绘反复读库), 上下文里只有标记本身。 */
  ctx.css('.msg-atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;width:100%;align-items:center}'
    + '.msg-atts audio{max-width:100%;height:32px}'
    + '.show-slot{display:inline-block;max-width:100%;vertical-align:top}'
    + '.msg-body .att-chip,.msg-atts .att-chip{max-width:100%;cursor:pointer}'

    + '.att-chip.show-dead{color:var(--warn);border-color:rgba(255,149,0,.35)}'); // 出屏/附件折叠样式
  const SHOW_RE = /\[\[show:([^\]\s]{1,200})\]\]/g;
  const escA = s2 => esc(s2).replace(/"/g, '&quot;');
  const _showCache = new Map(); // addr → 解析结果(防流式期间每 50ms 重绘反复读库/重解析); 上限 40 条
  const dlDataUrl = (name, du) => { const a2 = document.createElement('a'); a2.href = du; a2.download = name || 'media'; document.body.appendChild(a2); a2.click(); a2.remove(); };
  function showCard(slot, icon, label, acts) {

    (acts || []).forEach(x => { const b = document.createElement('button'); b.className = 'att-act'; b.textContent = x[0]; b.onclick = e => { e.stopPropagation(); x[1](b, c); }; c.appendChild(b); });
    slot.appendChild(c); return c;
  }
  function showDead(slot, addr, why) { showCard(slot, '⚠', '引用已失效/不可达: ' + addr + (why ? ' (' + String(why).slice(0, 60) + ')' : ''), []).classList.add('show-dead'); }
  function showMediaEl(slot, du, mime, name, hit) {
    slot.textContent = '';
    if (/^image\//.test(mime)) { const im = document.createElement('img'); im.className = 'show-media';
      if (hit && hit.w) im.style.aspectRatio = hit.w + ' / ' + hit.h; // 已知尺寸按比例占位(CSS aspect-ratio): 防高度塌陷; 不能用 width/height 属性——CSS max-width 压宽后属性高度不跟缩=拉长变形
      else if (hit) im.onload = () => { if (im.naturalWidth) { hit.w = im.naturalWidth; hit.h = im.naturalHeight; } };
      im.src = du; im.onclick = () => im.classList.toggle('big'); slot.appendChild(im); }
    else { const av = document.createElement(/^video\//.test(mime) ? 'video' : 'audio'); av.controls = true; av.src = du; if (/^video\//.test(mime)) av.className = 'show-media'; slot.appendChild(av); }
    const b = document.createElement('button'); b.className = 'att-act'; b.textContent = '⤓'; b.title = '下载'; b.onclick = () => dlDataUrl(name || 'media', du); slot.appendChild(b);
  }
  function showTextChip(slot, icon, label, content, name) {
    let d = null;
    return showCard(slot, icon, label, [['展开', () => { if (!d) { d = document.createElement('div'); d.className = 'cr-d'; d.textContent = content.length > 20000 ? content.slice(0, 20000) + '\n…[已截断, 全文 ' + content.length + ' 字]' : content; slot.appendChild(d); }
      else d.style.display = d.style.display === 'none' ? 'block' : 'none'; }],
      ['⤓', () => ctx.stem.download(name || 'colony.txt', content)]]);
  }
  const _b64ToDu = (s, mime) => !s ? null : /^data:/.test(s) ? s : 'data:' + (mime || 'application/octet-stream') + ';base64,' + s; // data 字段各源不一: 有的是完整 dataURL(net.fetch/wfasset), 有的是裸 base64(附件); 归一
  const _mediaDu = v => v && (v.dataUrl ? (/^data:/.test(v.dataUrl) ? v.dataUrl : _b64ToDu(v.dataUrl, v.mimeType)) : v.audioBase64 ? _b64ToDu(v.audioBase64, v.mimeType || 'audio/mpeg') : (v.data && v.mimeType ? _b64ToDu(v.data, v.mimeType) : null));
  async function resolveShow(slot) {
    const addr = slot.getAttribute('data-addr') || '';
    if (addr.startsWith('miniapp:')) { // 应用卡片(不缓存: 名称/体积会变)
      const id = addr.slice(8), rec = await appsOr().get(id);
      if (!rec) return showDead(slot, addr);
      showCard(slot, rec.icon || '📦', (rec.name || id) + ' · 应用 · ' + ((rec.code || '').length / 1024).toFixed(1) + 'KB',
        [['▶ 打开', () => { const u = ui(); u && u.openRunner ? u.openRunner(id) : alert('界面块不在岗, 无法打开运行'); }],
          ['⤓', () => ctx.stem.download((rec.name || id) + '.html', rec.code || '')]]);
      return;
    }
    if (addr.startsWith('fs:')) { // 口袋磁盘文件(porter 在岗才通); html 不直跑(流通安全: 导入为应用是用户手动决定)
      const path = addr.slice(3), name = path.split('/').pop();
      const r = await callCap('fs.read', { path, encoding: 'dataUrl' });
      const mime = r.mimeType || '';
      if (/^(image|audio|video)\//.test(mime)) return showMediaEl(slot, r.dataUrl, mime, name);
      const rt = await callCap('fs.read', { path });
      return showTextChip(slot, /html/.test(mime) || /\.html?$/i.test(name) ? '🌐' : '📄', name + ' · 口袋 · ' + ((r.bytes || 0) / 1024).toFixed(1) + 'KB', rt.text || '', name);
    }
    const key = addr.startsWith('kv:') ? addr.slice(3) : addr; // 其余一律当 kv key(chatasset:/media:/wfasset:/runtimeshot: 等裸写即可)
    const _showPut = (k, v) => { _showCache.set(k, v); if (_showCache.size > 40) _showCache.delete(_showCache.keys().next().value); }; // 上限淘汰唯一实现(活/死条目同规)
    let hit = _showCache.get(key);
    if (hit && hit.dead) { // 死引用也缓存(不然流式期每帧异步查库=芯片晚到一拍整列抖); 15s TTL 防"资产晚到却被永久钉死"
      if (Date.now() - hit.at > 15000) { _showCache.delete(key); hit = null; }
      else return showDead(slot, addr);
    }
    if (!hit) {
      const v = await ctx.kv.get(key);
      if (v == null) { _showPut(key, { dead: 1, at: Date.now() }); return showDead(slot, addr); }
      const du = _mediaDu(v), mime = (v && v.mimeType) || (du ? du.slice(5, du.indexOf(';')) : '');
      hit = du && /^(image|audio|video)\//.test(mime) ? { du, mime, name: v.name || key } : { text: typeof v === 'string' ? v : typeof v.text === 'string' ? v.text : JSON.stringify(v, null, 2), name: v && v.name };
      _showPut(key, hit);
    }
    if (hit.du) return showMediaEl(slot, hit.du, hit.mime, hit.name, hit);
    showTextChip(slot, '🗃', (hit.name || key) + ' · ' + hit.text.length + '字', hit.text, hit.name || key.replace(/[:/]/g, '_') + '.txt');
  }
  function appendMsg(author, text, cls) {

  function appendUserMsg(m) { // 用户消息: 文本附件 chip(当轮真身现渲, 归档后经引用取), 媒体内联(当轮真身 或 归档后的 chatasset 引用)
    const text = _txt(m.content), author = m.toName ? '你 → ' + m.toName : '你';
    const parts = Array.isArray(m.content) ? m.content.filter(p => p && (p.type !== 'text' || p.att)) : [];

  async function blobToWav16k(blob) {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC();
    const buf = await ac.decodeAudioData(await blob.arrayBuffer());
    const rate = 16000, len = Math.ceil(buf.duration * rate);
    const oc = new OfflineAudioContext(1, len, rate);
    const srcN = oc.createBufferSource(); srcN.buffer = buf; srcN.connect(oc.destination); srcN.start();
    const out = await oc.startRendering(); ac.close();
    const pcm = out.getChannelData(0);
    const wav = new DataView(new ArrayBuffer(44 + pcm.length * 2));
    const wr = (o, s) => { for (let i = 0; i < s.length; i++) wav.setUint8(o + i, s.charCodeAt(i)); };
    wr(0, 'RIFF'); wav.setUint32(4, 36 + pcm.length * 2, true); wr(8, 'WAVEfmt '); wav.setUint32(16, 16, true);
    wav.setUint16(20, 1, true); wav.setUint16(22, 1, true); wav.setUint32(24, rate, true); wav.setUint32(28, rate * 2, true);
    wav.setUint16(32, 2, true); wav.setUint16(34, 16, true); wr(36, 'data'); wav.setUint32(40, pcm.length * 2, true);
    for (let i = 0; i < pcm.length; i++) { const s = Math.max(-1, Math.min(1, pcm[i])); wav.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true); }
    let bin = ''; const u8 = new Uint8Array(wav.buffer); const CH = 0x8000;
    for (let i = 0; i < u8.length; i += CH) bin += String.fromCharCode.apply(null, u8.subarray(i, i + CH));

      const nOuts = Object.values(outs).filter(v => v != null && v !== '').length; // 空端口(如空text)不计, 别报"2项"却只有1个能看

      const txt = Object.values(outs).map(pickText).filter(Boolean)[0]; // 纯文本成果给一句预览: 媒体有[[show]]内联, 文本不能只报"N项"却啥都看不见
      const msg = (ev && ev.status === 'done' ? '✅ 后台工作流「' + ((ev && ev.name) || '') + '」完成' : '⚠ 后台工作流「' + ((ev && ev.name) || '') + '」失败: ' + String(((ev && ev.errors) || [])[0] || '').slice(0, 120))
        + (nOuts ? ' · 成果 ' + nOuts + ' 项' : '') + shows.map(k => ' [[show:' + k + ']]').join('')
        + (txt ? '\n「' + txt.trim().slice(0, 160) + (txt.trim().length > 160 ? '…' : '') + '」' : '')
        + ((ev && ev.notes && ev.notes.length) ? '\n' + ev.notes.slice(0, 3).join('\n') : ''); // 智选替换厂商等告知透传(后台不静默顶包)
      const rid = (ev && ev.runId) || '';
      const sess = _bgSess[rid] || curSession; delete _bgSess[rid]; // 按 runId 精确回发起会话(不是完成时恰好在看的会话)
      await appendHist(sess, { role: 'assistant', content: msg, ts: _tsNow() });
      if (sess === curSession) {
        appendMsg('工作流', msg, 'assistant');
        if (busy) { _interrupts.push(BG_RECEIPT + ' ' + msg); if (_turnAbort) { try { _turnAbort.abort(); } catch (e2) { } } } // 在途轮注入真结果: 大脑看到冒泡才收尾——根治"结果在上下文之外, 看不到就编"(弱脑事后瞎总结/捏造资产id)
      }
      else dockStatus('✅ 后台工作流「' + ((ev && ev.name) || '') + '」已完成 — 结果在发起它的会话里'); // 人在别的会话: 轻提示不打断
    } catch (e) { console.warn('[agent] 后台回执处理失败(不再无声):', e); }
  });
  ctx.on('agent:ask', p => { // 选中即问(代码解读的选段/ui-shell 的点选元素等任何块都可发此事件, kind 透传; 本块不在岗自然无人接 — 松耦合)
    try {
      const dock = document.getElementById('agent-dock'); if (!dock) return;
      dock.classList.remove('collapsed'); dock.classList.add('expanded');
      pendingAtts.push({ kind: (p && p.kind) || 'coderef', name: ((p && p.name) || (p && p.ref) || '代码引用').slice(0, 60), ref: (p && p.ref) || '', text: (p && p.text) || '' });
      renderAtts();
      const inp = document.getElementById('agent-input'); if (inp) inp.focus();
    } catch (e) { }
  });

  return { api: { prim }, dispose() { if (micStream) micStream.getTracks().forEach(t => t.stop()); } };
})
</script>

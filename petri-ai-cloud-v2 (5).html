    chip.className = 'prov-chip' + (p.id === activeId ? ' active' : '') + (p.verified && p.verified['text.chat'] ? ' tested' : '');
    chip.dataset.pid = p.id;
    chip.innerHTML = '<span class="prov-dot"></span>' + esc(p.name || '(未命名)');
    chip.onclick = () => renderProviderDetail(secRoot, p.id);
    chips.appendChild(chip);
  }
  secRoot.querySelector('#prov-add-btn').onclick = async () => {
    const p = await Settings.addProvider({ name: '新厂商', protocol: 'openai-compatible', endpoint: 'https://api.openai.com/v1/chat/completions', apiKey: '', model: '' });
    changed();
    await renderProviderChips(secRoot);
    renderProviderDetail(secRoot, p.id);
  };
  if (providers.length) renderProviderDetail(secRoot, activeId || providers[0].id);
  else secRoot.querySelector('#provider-detail').innerHTML = '<p class="settings-hint" style="padding:16px 0">点 + 添加一个 AI 厂商 (DeepSeek/MiniMax/Gemini/Claude/Ollama…)</p>';
}

        <div id="s-notes-list"></div>
        <div class="model-row" style="margin-top:8px">
          <input type="text" id="s-note-m" class="form-input mono" placeholder="模型名" style="max-width:42%">

    <div id="s-test-result" class="test-result hidden"></div>
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">

      <button class="ghost-btn" id="s-test" style="padding:8px 16px;font-size:12px">⚡ 测试</button>
      <button class="ghost-btn" id="s-set-active" style="padding:8px 16px;font-size:12px" title="不指定厂商的调用都走默认厂商">${p.id === activeId ? '✓ 默认厂商' : '设为默认'}</button>

  const get = (s) => root.querySelector(s);

  const persist = async (patch) => { const r = await Settings.updateProvider(id, patch); changed(); return r; };
  // 徽章双击熄灭: 模型过期/曾通现不通时手动归零, 再测即可重新点亮
  root.querySelectorAll('.ai-cap-chip').forEach(el => el.ondblclick = async () => {
    if (!el.classList.contains('ok')) return;
    await persist({ verified: { [el.dataset.cap]: null } });
    el.classList.remove('ok'); el.textContent = CAP_LABELS[el.dataset.cap]; el.title = '未实测';

  // 模型标注: 逐条可改(清空即删)可删, 底部添加; agent 经 ai.models 读同一份

      || '<p class="settings-hint" style="margin:6px 0 0">还没有标注。</p>';
    get('#s-notes-list').querySelectorAll('[data-nk]').forEach(inp => inp.onchange = async () => {

  get('#s-protocol').onchange = async (e) => {

    await persist({ protocol: e.target.value, endpoint: LLM.protocolDefault(e.target.value) || p.endpoint, ...(e.target.value === 'local' && !p.apiKey ? { apiKey: 'local' } : {}) });

  get('#s-allow-sdk').onchange = (e) => persist({ allowMiniAppSDK: e.target.checked });
  get('#s-model').onchange = (e) => persist({ model: e.target.value.trim() });
  get('#s-model-select').onchange = (e) => { if (e.target.value) { get('#s-model').value = e.target.value; persist({ model: e.target.value }); } };
  CAP_FIELDS.forEach(f => {
    const el = get('#s-cap-' + f.field);

  get('#s-fetch-voices').onclick = async () => {
    showResult('⋯ 拉取音色中...', 'ok');
    try {
      const vs = await listVoices(id);
      if (!vs.length) { showResult('✗ 该协议没有可拉的音色表', 'bad'); return; }
      get('#dl-voice').innerHTML = vs.map(v => `<option value="${esc(v[0])}">${esc(v[1] || v[0])}</option>`).join('');
      showResult('✓ 拉到 ' + vs.length + ' 个音色, 在音色框下拉选一个, 再测「语音」听效果', 'ok');
    } catch (e) { showResult('✗ ' + e.message, 'bad'); }
  };
  get('#s-concurrency').onchange = (e) => { const n = parseInt(e.target.value, 10); persist({ concurrency: (n >= 1 && n <= 64) ? n : undefined }); };
  get('#s-timeout').onchange = (e) => { const n = parseInt(e.target.value, 10); persist({ timeout: (n >= 10 && n <= 900) ? n : undefined }); };
  get('#s-proxy-enable').onchange = (e) => persist({ proxy: { enabled: e.target.checked, baseURL: get('#s-proxy-url').value.trim() } });
  get('#s-proxy-url').onchange = (e) => persist({ proxy: { enabled: get('#s-proxy-enable').checked, baseURL: e.target.value.trim() } });

  get('#s-fetch-models').onclick = async () => {
    showResult('⋯ 拉取中...', 'ok');
    try {
      const models = await LLM.detectModels(id);
      await persist({ models });
      renderProviderDetail(secRoot, id);   // 重新渲染 → 模型出现在下拉和各 datalist 里
      secRoot.querySelector('#s-test-result').className = 'test-result ok';
      secRoot.querySelector('#s-test-result').textContent = '✓ 拉到 ' + models.length + ' 个模型, 已填入下拉, 选一个再点测试';
    } catch (e) { showResult('✗ ' + e.message, 'bad'); }
  };
  get('#s-test').onclick = async () => {
    const model = get('#s-model').value.trim() || get('#s-model-select').value;
    if (model) await persist({ model });
    const task = get('#s-test-task').value;
    const tmSelMap = { 'text.chat': '#s-model' };
    CAP_FIELDS.forEach(f => { tmSelMap[f.cap] = '#s-cap-' + f.field; });
    const tmSel = tmSelMap[task];
    const tm = tmSel ? get(tmSel).value.trim() : '';
    if (tm && CAP_TASK_MODEL[task]) await persist({ [CAP_TASK_MODEL[task]]: tm });
    const useM = tm || (task === 'text.chat' ? model : '') || undefined;
    showResult('⋯ 测试中' + (/video|music/.test(task) ? '(较慢, 请稍候)' : '') + '...', 'ok');
    try {
      const r = await LLM.testCapability(id, task, useM); // 测通写台账(与 agent 的 ai.test 同一套), 不切活跃
      showResult('✓ ' + CAP_LABELS[task] + '测通 (模型: ' + (useM || '默认') + '): ' + r.detail, 'ok');
      const el = root.querySelector('.ai-cap-chip[data-cap="' + task + '"]'); // 原地点亮, 不打断面板
      if (el && !el.classList.contains('ok')) { el.classList.add('ok'); el.textContent = '✓ ' + CAP_LABELS[task]; }
      if (task === 'text.chat') { const bc = secRoot.querySelector('.prov-chip[data-pid="' + id + '"]'); if (bc) bc.classList.add('tested'); }
      changed();
    } catch (e) { showResult('✗ ' + e.message, 'bad'); }
  };
  get('#s-set-active').onclick = async () => { await Settings.setActiveProvider(id); changed(); renderProviderChips(secRoot); };
  get('#s-del').onclick = async () => {
    if (!confirm('删除「' + p.name + '」?')) return;
    await Settings.deleteProvider(id);
    changed();
    renderProviderChips(secRoot);
  };
}

/* ── 配置种子: 保存→随块源码出走→导入方一次性播种(运输走现成的 saveBlock 覆盖层/wrapBlock 导出/adopt 检疫, 零新机制) ── */
const seedSig = o => { const s = JSON.stringify(o); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h + ':' + s.length; };
async function applySeed() { // 同指纹只播一次(不碾用户后改); 重新导出的新种子指纹变→自动升级; 按厂商名合并, 不删接收方已有厂商
  if (!PROVIDER_SEED || !Array.isArray(PROVIDER_SEED.providers) || !PROVIDER_SEED.providers.length) return;
  const sig = seedSig(PROVIDER_SEED);
  if ((await Store.settings.get('ai.seedApplied', null)) === sig) return;
  for (const sp of PROVIDER_SEED.providers) {
    if (!sp.name) continue;
    const patch = { ...sp }; delete patch.id; // id 不随种子走: 同名合并/新名新增(判据与 ai.configure 一致), 防撞 id
    const old = (await Settings.getProviders()).find(x => x.name === sp.name);
    if (old) await Settings.updateProvider(old.id, patch); else await Settings.addProvider(patch);
  }
  if (PROVIDER_SEED.activeName) { const p = (await Settings.getProviders()).find(x => x.name === PROVIDER_SEED.activeName); if (p) await Settings.setActiveProvider(p.id); }
  await Store.settings.set('ai.seedApplied', sig);
  changed();
}
async function saveSeedToBlock() { // 「打包配置版」: 种子写进本块源码覆盖层(saveBlock 热替换自己) → wrapBlock 直接出带配置的独立 Petri
  const provs = await Settings.getProviders();
  if (!provs.length) return alert('还没有配置任何厂商');
  const activeId = await Settings.getActiveProviderId();
  const seed = { providers: provs.map(p => { const c = { ...p }; delete c.id; return c; }), activeName: (provs.find(p => p.id === activeId) || {}).name || null };
  if (!confirm('把 ' + provs.length + ' 个厂商的配置(含明文 API Key 与已测通台账)写进本块源码, 并导出自带配置的独立 Petri?\n\n对方导入并启用后拿来即用。\n⚠ 导出文件含明文 Key, 只给信任的人。')) return;
  const b = ctx.stem.getBlock(ctx.id);
  const json = JSON.stringify(seed).replace(/</g, '\\u003c'); // 转义 <: 块源码不得含字面闭合脚本标签(validateCode 拒)
  const nc = b.code.replace(/const PROVIDER_SEED = \/\*⚘SEED\*\/[\s\S]*?\/\*⚘SEED\*\//, () => 'const PROVIDER_SEED = /*⚘SEED*/' + json + '/*⚘SEED*/'); // 替换函数防 Key 里的 $ 被当替换模式
  if (nc === b.code) return alert('种子槽标记(⚘SEED)丢失, 无法写入 — 块源码被改动过?');
  await Store.settings.set('ai.seedApplied', seedSig(seed)); // 先记指纹: 本机热替换重启后不重播自己
  try { await ctx.stem.saveBlock(ctx.id, nc); } catch (e) { return alert('写入源码失败: ' + e.message); }
  try { ctx.stem.wrapBlock(ctx.id); } catch (e) { alert('配置已写入源码, 但自动导出失败(' + e.message + ') — 去 源码管理→导出本块 手动导出'); }
}

/* ── 云端网关（最简版）: 把本地厂商配置同步到 Cloudflare Worker ── */
const CLOUD_GATEWAY_KEY = 'ai.cloudGateway';
const SIMPLE_WORKER_CODE = `export default {
  async fetch(request, env, ctx) {
    const url = new URL(request.url);
    const cors = {
      'Access-Control-Allow-Origin': '*',
      'Access-Control-Allow-Methods': 'GET, POST, PUT, OPTIONS',
      'Access-Control-Allow-Headers': '*',
      'Access-Control-Max-Age': '86400',
    };
    if (request.method === 'OPTIONS') {
      return new Response(null, { status: 204, headers: cors });
    }
    if (url.pathname === '/admin/sync' && request.method === 'POST') {
      try {
        const body = await request.json();
        if (!body.models || typeof body.models !== 'object') {
          return json({ error: 'models object required' }, 400, cors);
        }
        await env.MODELS_KV.put('models', JSON.stringify(body.models));
        return json({ ok: true, count: Object.keys(body.models).length, models: Object.keys(body.models) }, 200, cors);
      } catch (e) {
        return json({ error: e.message }, 500, cors);
      }
    }
    if (url.pathname === '/admin/status') {
      const raw = await env.MODELS_KV.get('models');
      const models = raw ? JSON.parse(raw) : {};
      return json({ ok: true, modelCount: Object.keys(models).length, models: Object.keys(models) }, 200, cors);
    }
    if ((url.pathname === '/models' || url.pathname === '/v1/models') && request.method === 'GET') {
      const raw = await env.MODELS_KV.get('models');
      const models = raw ? JSON.parse(raw) : {};
      const data = Object.keys(models).map(id => ({
        id, object: 'model', created: Math.floor(Date.now() / 1000), owned_by: 'colony-gateway'
      }));
      return json({ object: 'list', data }, 200, cors);
    }
    try {
      const bodyText = await request.text();
      let body = {};
      if (bodyText) {
        try { body = JSON.parse(bodyText); } catch (e) { /* allow empty */ }
      }
      const modelName = body.model || url.searchParams.get('model');
      if (!modelName) {
        return json({ error: 'model is required (in body or query)' }, 400, cors);
      }
      const raw = await env.MODELS_KV.get('models');
      const MODELS = raw ? JSON.parse(raw) : {};
      const entry = MODELS[modelName];
      if (!entry) {
        return json({ error: \`Model "\${modelName}" not found\`, available: Object.keys(MODELS) }, 400, cors);
      }
      const path = url.pathname;
      let capability = 'chat';
      if (/\/images\/edits/i.test(path)) capability = 'imageEdit';
      else if (/image|imagen|generation/i.test(path)) capability = 'image';
      else if (/audio\/speech|tts|voice/i.test(path)) capability = 'tts';
      else if (/transcription|stt|asr/i.test(path)) capability = 'stt';
      else if (/embedding/i.test(path)) capability = 'embedding';
      else if (/rerank/i.test(path)) capability = 'rerank';
      else if (/video|veo|hailuo/i.test(path)) capability = 'video';
      else if (/music|song/i.test(path)) capability = 'music';
      else if (/chat|completion|message/i.test(path)) capability = 'chat';
      const config =
        (entry[capability]) ||
        (entry.chat) ||
        (entry.default) ||
        (entry.url ? entry : null);
      if (!config || !config.url || !config.key) {
        return json({
          error: \`Model "\${modelName}" has no config for "\${capability}"\`,
          availableCapabilities: Object.keys(entry)
        }, 400, cors);
      }
      let targetUrl = config.url;
      if (config.base) {
        targetUrl = config.base.replace(/\/+$/, '') + path + url.search;
      }
      if (config.model && body.model) body.model = config.model;
      const upstream = await fetch(targetUrl, {
        method: request.method,
        headers: {
          'Content-Type': request.headers.get('Content-Type') || 'application/json',
          'Authorization': \`Bearer \${config.key}\`,
        },
        body: bodyText || undefined,
      });
      const newHeaders = new Headers(upstream.headers);
      Object.entries(cors).forEach(([k, v]) => newHeaders.set(k, v));
      return new Response(upstream.body, {
        status: upstream.status,
        statusText: upstream.statusText,
        headers: newHeaders,
      });
    } catch (err) {
      return json({ error: err.message }, 502, cors);
    }
  }
};
function json(data, status = 200, extra = {}) {
  return new Response(JSON.stringify(data), {
    status,
    headers: { 'Content-Type': 'application/json', ...extra }
  });
}`;

async function getCloudGateway() {
  return (await Store.settings.get(CLOUD_GATEWAY_KEY, null)) || { workerURL: '' };
}
async function saveCloudGateway(patch) {
  const cur = await getCloudGateway();
  const next = { ...cur, ...patch };
  await Store.settings.set(CLOUD_GATEWAY_KEY, next);
  return next;
}

async function syncToCloud() {
  const gw = await getCloudGateway();
  const workerURL = (gw.workerURL || '').replace(/\/+$/, '');
  if (!workerURL) return alert('请先填写 Worker 地址');

  const provs = await Settings.getProviders();
  const models = {};

  // 根据 endpoint 推导能力完整 URL
  function buildUrl(endpoint, protocol, kind) {
    return joinCap(endpoint, kind);
  }

  for (const p of provs) {
    if (!p.apiKey || !p.endpoint) continue;

    const key = p.apiKey;
    const protocol = p.protocol || 'openai-compatible';

    // 主对话模型
    const mainModel = p.model || (p.models && p.models[0]);
    if (mainModel) {
      if (!models[mainModel]) models[mainModel] = {};
      models[mainModel].chat = {
        url: buildUrl(p.endpoint, protocol, 'chat'),
        key
      };
      models[mainModel].default = models[mainModel].chat;
    }

    // 把 models 列表里的其他模型也挂上同一套 chat 配置
    if (Array.isArray(p.models)) {
      for (const m of p.models) {
        if (!m) continue;
        if (!models[m]) models[m] = {};
        if (!models[m].chat) {
          models[m].chat = {
            url: buildUrl(p.endpoint, protocol, 'chat'),
            key
          };
          models[m].default = models[m].chat;
        }
      }
    }

    // 按 CAP_FIELDS 同步各能力
    for (const f of CAP_FIELDS) {
      const m = p[f.field];
      if (!m) continue;
      if (!models[m]) models[m] = {};
      models[m][f.kind] = {
        url: buildUrl(p.endpoint, protocol, f.kind),
        key
      };
      if (!models[m].chat && !models[m].default) {
        models[m].default = models[m][f.kind];
      }
    }
  }

  if (!Object.keys(models).length) {
    return alert('没有可同步的模型（需要有 apiKey + endpoint + 模型名）');
  }

  try {
    const res = await fetch(workerURL + '/admin/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ models }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    alert('同步成功！\n已推送 ' + data.count + ' 个模型：\n' + (data.models || []).join('\n'));
  } catch (e) {
    alert('同步失败: ' + e.message);
  }
}

/* ── miniapp SDK 能力全套注册(谁提供能力谁注册; 全部过 allowMiniAppSDK 权限闸) ──
   provider 可传内部 id, 也可传名称或协议名, 这里统一解析。 */
async function _findProv(v) { // id/名称/协议名 → provider(协议名优先取配了 Key 的)
  const all = await LLM.allProviders();
  return all.find(x => x.id === v) || all.find(x => x.name === v) || all.find(x => x.protocol === v && x.apiKey) || all.find(x => x.protocol === v) || null;
}
async function _withProv(a) {

  delete a.provider;
  return a;
}

  const x = await _withProv(a);

  return LLM.generateAudio(x);
});
ctx.sdk.handle('ai.transcribe', async a => { // 入参宽容: {audio:{data,mimeType}} 或 {audioBase64,mimeType} → {text}
  const x = await _withProv(a);

  for await (const ch of LLM.chatStream(await _withProv(a))) yield { delta: (ch && ch.delta) || '', reasoning: (ch && ch.reasoning) || '' };
});
/* ai.models 三档: 不传参=现状形状(兼容存量); kind:'text'=测试通过的文本模型跨厂商聚合(与 AI 配置完全同步, 选择器现取现用);
   kind:'multimodal'=文本之外全量(图/视频/音乐/TTS/STT 及归属厂商, 带 verified 实测标)。 */
const NON_TEXT_RE = /(tts|speech|image|video|veo|imagen|embedding|music|hailuo|asr|audio|router)/i;
ctx.sdk.handle('ai.models', async (a) => {
  a = a || {};
  if (a.kind === 'text') {
    const settingsIds = new Set((await LLM.getCapabilities()).map(x => x.id));
    const activeId = await Settings.getActiveProviderId();
    const out = [];
    for (const p of (await LLM.allProviders()).filter(p => p.allowMiniAppSDK && p.apiKey)) {
      const isExternal = !settingsIds.has(p.id); // 桥端点成员: 活探在线即等效已验
      if (!isExternal && !(p.verified && p.verified['text.chat'])) continue; // 与 AI 配置同步: 只给测试通过的
      const ms = (p.models || []).filter(m => !NON_TEXT_RE.test(m));
      if (p.model && !ms.includes(p.model)) ms.unshift(p.model);
      // default 全局唯一 = 默认厂商的默认模型(应用下拉预选它)
      for (const m of ms) out.push({ model: m, providerId: p.id, provider: p.name, protocol: p.protocol, default: p.id === activeId && m === p.model, ...(p.notes && p.notes[m] ? { note: p.notes[m] } : {}) });
    }

  }
  if (a.kind === 'multimodal') {
    const out = [];
    for (const p of (await LLM.getCapabilities()).filter(p => p.allowMiniAppSDK && p.hasKey)) {
      for (const c of p.capabilities) {
        if (!(c in CAP_TASK_MODEL)) continue; // 只列文本之外的可产出能力(*.input 与 text.chat 不在此档)
        const tm = p[CAP_TASK_MODEL[c]] || '';
        const note = p.notes[tm] || p.notes[c] || '';
        out.push({ capability: c, providerId: p.id, provider: p.name, protocol: p.protocol, model: tm, verified: !!(p.verified && p.verified[c]), ...(note ? { note } : {}) });
      }
    }
    return { kind: 'multimodal', capabilities: out };
  }
  return (await LLM.allProviders())
    .filter(p => p.allowMiniAppSDK && p.apiKey)
    .map(p => ({ id: p.id, name: p.name, protocol: p.protocol, models: p.models || [], ttsModel: p.ttsModel || null, sttModel: p.sttModel || null }));
});
/* ── agent 自配置门面: 用户把 Key 交给 agent → agent 自己配厂商/测通路/记台账/标注模型问题。

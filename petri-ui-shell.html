font-style:italic;
font-weight:700;

font-size:12px;
font-weight:600;

padding:14px 18px;
border-bottom:1px solid var(--border)}

color:var(--accent)}
.pm-name{font-size:14px;
font-weight:600}
.pm-lineage{margin-left:auto;
font-size:11px;
color:var(--text-muted)}
.settings-hint{font-size:11px;
color:var(--text-muted);
line-height:1.6}
body[data-wrapper] [data-block-id]{padding:18px}

  /* ── 桌面: 绝对定位图标 + 指针拖拽 + 文件夹(位置/文件夹存 settings:ui.desktop.*, 壳私有数据) ── */

      if (!deskDrag || deskDrag.el !== el) return;
      const d = deskDrag; deskDrag = null; markDropTarget(null); el.classList.remove('dragging');
      if (d.moved) {
        suppressClickUntil = Date.now() + 350;
        const under = folderTargetAt(e.clientX, e.clientY);
        if (under && d.id.startsWith('app:')) await addAppToFolder(d.id.slice(4), under.id);
        else await setPos(id, parseFloat(el.style.left) || 0, parseFloat(el.style.top) || 0);
        renderApps();
        e.preventDefault(); e.stopPropagation();
      }
    };
    el.onpointercancel = () => { if (deskDrag && deskDrag.el === el) { deskDrag = null; markDropTarget(null); el.classList.remove('dragging'); } }; // 触摸中断兜底: dragging 带 pointer-events:none, 残留=图标假死
  }
  function appMenu(m, folderId) { return [
    { k: 'open', t: '打开', fn: () => openRunner(m.id) },
    { k: 'ren', t: '重命名', fn: async () => { const name = prompt('新名称', m.name); if (name) { await saveAppMeta(m.id, { name }); renderApps(); } } },
    { k: 'src', t: '看源码', fn: () => codeOpen('miniapp:' + m.id) }, '-',
    { k: 'copy', t: '复制', fn: () => { deskClipboard = { type: 'copy', app: m }; toast('已复制'); } },
    { k: 'cut', t: '剪切', fn: () => { deskClipboard = { type: 'cut', app: m }; renderApps(); toast('已剪切'); } },
    folderId ? { k: 'out', t: '移到桌面', fn: async () => { await removeAppFromFolders(m.id); ctx.emit('apps:changed'); renderApps(); } } : null,
    { k: 'del', t: '删除', fn: async () => { if (confirm('删除「' + m.name + '」?')) await apps().remove(m.id); } }
  ].filter(Boolean); }
  async function openFolder(f) {
    ctx.root.querySelectorAll('.win-folder-window[data-id="' + f.id + '"]').forEach(x => x.remove());
    unregisterShellWin('folder:' + f.id); folderWindows.delete(f.id);
    const win = document.createElement('div'); win.className = 'win-folder-window'; win.dataset.id = f.id;
    win.innerHTML = '<div class="win-folder-titlebar"><div class="win-folder-title">📁 <span>' + esc(f.name || '文件夹') + '</span></div><button class="win-folder-close" title="关闭">×</button></div>'
      + '<div class="win-folder-body"><div class="win-folder-hint">把里面的应用拖到窗口外即可回到桌面；右键空白处可粘贴到此文件夹。</div>'
      + '<div class="folder-app-grid" id="folder-grid-' + esc(f.id) + '"></div></div>';
    ctx.root.appendChild(win);
    const W = Math.min(720, innerWidth - 24); win.style.left = Math.max(8, (innerWidth - W) / 2) + 'px'; win.style.top = Math.max(8, innerHeight * 0.12) + 'px'; // JS 居中(不用 transform, 拖动直接写 left/top)
    const bar = win.querySelector('.win-folder-titlebar');
    const grid = win.querySelector('.folder-app-grid');
    const closeBtn = win.querySelector('.win-folder-close');
    closeBtn.onpointerdown = e => { e.stopPropagation(); };
    closeBtn.onclick = e => { e.stopPropagation(); folderWindows.delete(f.id); unregisterShellWin('folder:' + f.id); win.remove(); };
    win.onpointerdown = () => focusShellWin('folder:' + f.id);
    let wd = null;
    bar.onpointerdown = e => { wd = { sx: e.clientX, sy: e.clientY, ox: win.offsetLeft, oy: win.offsetTop }; bar.setPointerCapture(e.pointerId); };
    bar.onpointermove = e => { if (!wd) return; win.style.left = Math.max(4, Math.min(innerWidth - 120, wd.ox + e.clientX - wd.sx)) + 'px'; win.style.top = Math.max(4, Math.min(innerHeight - 80, wd.oy + e.clientY - wd.sy)) + 'px'; };
    bar.onpointerup = () => { wd = null; };
    const render = async () => {
      const fs = await getFolders(); const cur = fs.find(x => x.id === f.id) || { items: [] };
      const ids = cur.items || []; const fresh = await apps().list(); const map = new Map(fresh.map(a => [a.id, a]));
      grid.innerHTML = ids.length ? ids.map(id => {
        const m = map.get(id); if (!m) return '';
        const cut = deskClipboard && deskClipboard.type === 'cut' && deskClipboard.app && deskClipboard.app.id === id ? ' cutting' : '';
        return '<div class="folder-app' + cut + '" data-id="' + esc(id) + '"><div class="fi">' + esc(m.icon || '📦') + '</div><div class="fn">' + esc(m.name) + '</div></div>';
      }).join('') : '<p class="settings-hint">这个文件夹是空的。</p>';
      grid.querySelectorAll('.folder-app').forEach(el => {
        const m = map.get(el.dataset.id); let fd = null;
        el.onpointerdown = e => { if (e.button !== 0) return; fd = { sx: e.clientX, sy: e.clientY, moved: false }; el.setPointerCapture(e.pointerId); };
        el.onpointermove = e => { if (!fd) return; if (Math.abs(e.clientX - fd.sx) + Math.abs(e.clientY - fd.sy) > 8) { fd.moved = true; el.classList.add('dragging'); } };
        el.onpointerup = async e => {
          if (!fd) return; const d = fd; fd = null; el.classList.remove('dragging');
          if (d.moved) {
            const inside = win.contains(document.elementFromPoint(e.clientX, e.clientY));
            if (!inside) { const r = $('page-apps').getBoundingClientRect(); await removeAppFromFolders(m.id); await setPos('app:' + m.id, e.clientX - r.left, e.clientY - r.top); ctx.emit('apps:changed'); await render(); renderApps(); toast('已移到桌面'); }
          }
        };
        el.ondblclick = () => openRunner(m.id);
        el.onclick = () => { if (Date.now() < suppressClickUntil) return; };
        el.oncontextmenu = e => { e.preventDefault(); showMenu(e.clientX, e.clientY, appMenu(m, f.id)); };
      });
    };
    folderWindows.set(f.id, { win, render });
    registerShellWin('folder:' + f.id, f.name || '文件夹', win, { icon: '📁' });
    grid.oncontextmenu = e => { if (e.target.closest('.folder-app')) return; e.preventDefault(); showMenu(e.clientX, e.clientY, [{ k: 'paste', t: '粘贴到此文件夹', disabled: !deskClipboard, fn: async () => { await pasteTo(f.id); await render(); } }, { k: 'refresh', t: '刷新', fn: render }]); };
    render();
  }
  /* ── 应用网格: 绝对定位桌面(位置持久化, 冲突自动找空位) ── */
  async function renderApps() {
    if (!apps()) return; // 独立穿衣环境无 Stem 服务, 正当降级
    const grid = $('apps-grid');
    const all = await apps().list(); const pos = await getPositions(); const folders = await getFolders();
    const inFolder = new Set(folders.flatMap(f => f.items || []));
    grid.innerHTML = '';
    if (!all.length && !folders.length) {
      grid.innerHTML = '<div class="apps-empty">还没有应用。对右下角 agent 气泡说"做一个 xxx"，或从开始菜单打开「次元口袋」导入。右键/长按桌面可新建文件夹。</div>';
      return;
    }
    const used = new Set(); let changedPos = false;
    const next = id => {
      let p = pos[id] ? snapPos(pos[id].x, pos[id].y) : null;
      if (!p || used.has(posSlot(p))) { p = findFreePos(p || nextGridPos(0), used); pos[id] = p; changedPos = true; }
      else used.add(posSlot(p));
      return p;
    };
    for (const f of folders) {
      const p = next('folder:' + f.id);
      const el = document.createElement('div'); el.className = 'desktop-folder'; el.dataset.id = f.id;
      el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
      const count = (f.items || []).length;
      el.innerHTML = '<div class="icon">📁</div>' + (count ? '<div class="count">' + count + '</div>' : '') + '<div class="name">' + esc(f.name || '新建文件夹') + '</div>';
      bindDesktopDrag(el, 'folder:' + f.id);
      el.onclick = () => { if (Date.now() < suppressClickUntil) return; openFolder(f); };
      el.oncontextmenu = e => { e.preventDefault(); showMenu(e.clientX, e.clientY, [
        { k: 'open', t: '打开', fn: () => openFolder(f) },
        { k: 'paste', t: '粘贴到此文件夹', disabled: !deskClipboard, fn: () => pasteTo(f.id) }, '-',
        { k: 'ren', t: '重命名', fn: async () => { const name = prompt('文件夹名称', f.name || '新建文件夹'); if (!name) return; const fs = await getFolders(); const it = fs.find(x => x.id === f.id); if (it) it.name = name; await putFolders(fs); renderApps(); } },
        { k: 'del', t: '删除文件夹', fn: async () => { if ((f.items || []).length && !confirm('文件夹里有应用，删除后应用会回到桌面，继续?')) return; const fs = (await getFolders()).filter(x => x.id !== f.id); await putFolders(fs); renderApps(); } }
      ]); };
      grid.appendChild(el);
    }
    for (const m of all.filter(a => !inFolder.has(a.id))) {
      const p = next('app:' + m.id);
      const card = document.createElement('div');
      card.className = 'app-card' + (deskClipboard && deskClipboard.type === 'cut' && deskClipboard.app && deskClipboard.app.id === m.id ? ' cutting' : '');
      card.dataset.id = m.id; // 中性管道: 卡片可被任何块按 id 装饰(node 徽章/解读芯片)
      card.style.left = p.x + 'px'; card.style.top = p.y + 'px';
      card.innerHTML = appCardHTML(m);
      bindDesktopDrag(card, 'app:' + m.id);
      card.onclick = async e => {
        if (Date.now() < suppressClickUntil || deskDrag) return;
        if (e.target.classList.contains('del-btn')) { if (confirm('删除「' + m.name + '」?')) await apps().remove(m.id); }
        else if (!e.target.classList.contains('analyze-chip')) openRunner(m.id); // 芯片点击归 code 块自己的 onclick
      };
      card.oncontextmenu = e => { e.preventDefault(); showMenu(e.clientX, e.clientY, appMenu(m)); };
      grid.appendChild(card);
    }
    if (changedPos) ctx.kv.set(posKey, pos).catch(() => { });
  }

  /* ── 开始菜单 Petri 列表: 错误/已改徽章; 已改徽章点击=恢复出厂 ── */
  function renderTiles() {
    const startList = $('win-petri-list'); if (!startList) return;
    startList.innerHTML = '';
    for (const b of ctx.stem.listBlocks()) {
      const item = document.createElement('div'); item.className = 'win-petri-item';
      item.innerHTML = '<div class="win-petri-main"><span>🧩</span><div><div class="win-petri-name">' + esc(b.name) + '</div><div class="win-petri-id">' + esc(b.id) + '</div></div></div>'
        + '<div class="win-petri-flags">' + (b.error ? '<span class="win-chip err" title="' + esc(b.error) + '">错误</span>' : '')
        + (b.dirty ? '<span class="win-chip dirty" data-reset="1" title="已改过 · 点击恢复出厂版">已改 ↺</span>' : '') + '</div>';
      item.onclick = async e => {
        if (e.target.dataset && e.target.dataset.reset) {
          e.stopPropagation();
          if (confirm('把「' + b.name + '」恢复到出厂版? 你对它的修改会丢失。')) { await ctx.stem.restoreFactory(b.id); toast('已恢复出厂版'); renderTiles(); }
          return;
        }
        closeStartMenu(); openBlockPage(b.id);
      };
      startList.appendChild(item);
    }
  }
  /* 源码管理器迁出为 petri:code(代码解读); code 在岗→调它, 不在岗→复用 Stem PANEL 浮层(不另写 UI) */
  const codeOpen = id => {
    const c = ctx.service('code');
    c ? c.open(id) : (ctx.stem.openPanel ? ctx.stem.openPanel() : toast('「代码解读」块不在岗'));
  };

  /* ── 块页: 点开始菜单 Petri 条目 → 打开该块自己的功能界面 ── */
  const blockPages = {}; // blockId → open()
  function openBlockPage(blockId) {
    if (blockPages[blockId]) {
      try { blockPages[blockId](); return; } catch (e) { }
    }
    const info = ctx.stem.listBlocks().find(x => x.id === blockId) || { name: blockId };
    const secs = settingsSections.filter(s => s.blockId === blockId);
    if (!secs.length) return codeOpen(blockId); // 没有功能页的块兜底到源码
    const o = mkModal('<h2>' + esc(info.name) + ' <span style="font-size:11px;color:var(--text-muted)">' + esc(blockId) + ' · v' + info.version + (info.dirty ? ' · 已修改' : '') + '</span></h2>'
      + '<div id="bp-body"></div>'
      + '<div style="display:flex;gap:8px;margin-top:14px"><button class="ad-btn-ghost" id="bp-wrap" title="穿上运行外壳导出, 可独立打开使用; 同时是系统块凭证, 传回任何 Colony 上传即融入">⤓ 导出独立 Petri</button><button class="ad-btn-ghost" id="bp-src">📦 源码管理器</button></div>', true);
    const body = o.querySelector('#bp-body');
    for (const s of secs.sort((a, b) => (a.order || 9) - (b.order || 9))) renderSection(s, body, o, false);
    o.querySelector('#bp-wrap').onclick = () => {
      ctx.stem.wrapBlock(blockId);
      toast('已导出独立 Petri(含凭证, 可独立运行/可回流)');
    };
    o.querySelector('#bp-src').onclick = () => {
      o.remove();
      codeOpen(blockId);
    };
  }

  /* ── 设置 modal: 壳出骨架, 各块经插槽注册自己的区 ── */
  const settingsSections = [];
  function renderSection(s, parent, o, withTitle) {   // 设置区渲染共用核: 设置modal(带标题)与块页(仅desc)共用
    const sec = document.createElement('div');
    sec.className = 'settings-card';
    sec.innerHTML = (withTitle ? '<h3 class="settings-section-title">' + esc(s.title || s.label || '') + '</h3>' : '')
      + (s.desc ? '<p class="settings-hint"' + (withTitle ? '' : ' style="margin-top:0"') + '>' + esc(s.desc) + '</p>' : '');
    const host = document.createElement('div'); host.className = 'sec-body';
    sec.appendChild(host);
    parent.appendChild(sec);
    try { s.render(host, { modal: o, toast }); } catch (e) { host.textContent = '渲染失败: ' + e.message; }
  }
  function openSettings() {
    const o = mkModal('<h2>设置</h2><div id="settings-body"></div>', true);
    const body = o.querySelector('#settings-body');
    if (!settingsSections.length) body.innerHTML = '<p class="settings-hint">没有块注册设置区。</p>';
    for (const s of settingsSections.slice().sort((a, b) => (a.order || 9) - (b.order || 9))) renderSection(s, body, o, true);
  }
  /* ── 侧栏抽屉 + 任务栏 + 开始菜单接线 ── */
  $('sb-list').innerHTML = '<div class="sb-item active">🖥 Desktop</div><div class="sb-slot" id="sb-slot"></div>'; // 首项 .sb-item + #sb-slot 是 workflow 的挂点契约, 顺序不可变
  const sidebar = $('app-sidebar');
  const closeDrawer = () => sidebar.classList.remove('open');
  const startBtn = $('win-start-btn'), startMenu = $('win-start-menu');
  function closeStartMenu() { startMenu.classList.remove('show'); startBtn.classList.remove('active'); }
  $('win-drawer').onclick = e => { e.stopPropagation(); closeStartMenu(); sidebar.classList.toggle('open'); };
  ctx.listen(document, 'click', e => { if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && !e.target.closest('#win-drawer')) closeDrawer(); });
  ctx.listen(sidebar, 'click', e => { const el = e.target; if (el.closest('.sb-item') || el.closest('[class^="wf-"], [class*=" wf-"]')) setTimeout(closeDrawer, 120); }); // 选中条目后收抽屉(先让 workflow 的 handler 跑)
  startBtn.onclick = e => { e.stopPropagation(); closeDrawer(); startMenu.classList.toggle('show'); startBtn.classList.toggle('active', startMenu.classList.contains('show')); };
  ctx.listen(document, 'click', e => { if (startMenu.classList.contains('show') && !startMenu.contains(e.target) && !startBtn.contains(e.target) && e.target !== startBtn) closeStartMenu(); });
  $('win-settings').onclick = () => { closeStartMenu(); openSettings(); };
  $('win-src').onclick = () => { closeStartMenu(); codeOpen(ctx.id); };
  $('win-refresh').onclick = () => { closeStartMenu(); renderApps(); renderTiles(); toast('已刷新'); };
  const clock = $('win-clock');
  function tickClock() {
    if (!clock) return; const d = new Date();
    clock.innerHTML = '<div>' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false }) + '</div>'
      + '<div style="font-size:10px;opacity:.75">' + d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit', weekday: 'short' }) + '</div>';
  }
  tickClock(); ctx.timer(tickClock, 10000, true); // 第三参 true=循环

  /* ── 壁纸: kv settings:ui.wallpaper, 默认 picsum 随机; 预载失败保留当前(诚实 toast) ── */
  const wallpaperSize = () => innerWidth <= 700 ? '1080/1920' : '1920/1080';
  const randomWallpaperUrl = () => 'https://picsum.photos/' + wallpaperSize() + '?random=' + Date.now();
  async function loadWallpaper(url, opt) {
    opt = opt || {}; const img = new Image(); img.referrerPolicy = 'no-referrer';
    img.onload = async () => {
      if (opt.save) await ctx.kv.set('settings:ui.wallpaper', { url, source: opt.source || 'custom', at: Date.now() });
      document.documentElement.style.setProperty('--shell-wallpaper', 'url(' + url + ')');
      if (opt.toast) toast(opt.toast);
    };
    img.onerror = () => toast('壁纸加载失败，已保留当前壁纸');
    img.src = url;
  }
  async function applyWallpaper() { const v = await ctx.kv.get('settings:ui.wallpaper'); if (v && v.url) loadWallpaper(v.url); else refreshWallpaper(); }
  async function refreshWallpaper() { loadWallpaper(randomWallpaperUrl(), { save: true, source: 'picsum', toast: '已换桌面壁纸' }); }
  $('win-refresh-wallpaper').onclick = refreshWallpaper;
  $('win-custom-wallpaper').onclick = async () => {
    closeStartMenu();
    const old = (await ctx.kv.get('settings:ui.wallpaper')) || {};
    const url = prompt('输入图片地址作为桌面壁纸', old.url || '');
    if (url) loadWallpaper(url, { save: true, source: 'custom', toast: '已设置自定义壁纸' });
  };
  /* 桌面右键/长按菜单 */
  const desktop = $('page-apps');
  desktop.oncontextmenu = e => {
    if (e.target.closest('.app-card,.desktop-folder,.win-taskbar,.win-start-menu,.win-folder-window')) return;
    e.preventDefault();
    const r = desktop.getBoundingClientRect(); const at = { x: e.clientX - r.left, y: e.clientY - r.top };
    showMenu(e.clientX, e.clientY, [
      { k: 'folder', t: '新建文件夹', fn: async () => { const fs = await getFolders(); const id = 'f' + Date.now().toString(36); fs.push({ id, name: '新建文件夹', items: [] }); await putFolders(fs); await setPos('folder:' + id, at.x, at.y); renderApps(); } },
      { k: 'paste', t: '粘贴到桌面', disabled: !deskClipboard, fn: async () => pasteTo(null, at) }, '-',
      { k: 'arrange', t: '自动排列图标', fn: arrangeDesktop },
      { k: 'refresh', t: '刷新', fn: () => { renderApps(); renderTiles(); } },
      { k: 'wall', t: '换壁纸', fn: refreshWallpaper }, '-',
      { k: 'edit', t: '✎ 编辑界面', fn: openUiEditor }
    ]);
  };
  let _rzT = null;
  ctx.listen(window, 'resize', () => { clearTimeout(_rzT); _rzT = setTimeout(renderApps, 180); }); // 旋转/改窗后按新格子重排

  /* ── 视图定位(为 agent): 语义骨架 = 真实用户所见(当前在哪个界面/桌面有谁/开着什么); 主读运行时 DOM, 与 agent 眼手 runtime.snapshot(DOM 细节)/waitFor 互补 ── */
  function uiState() {
    const doc = document, q = s => doc.querySelector(s), has = (s, c) => { const e = q(s); return !!(e && e.classList.contains(c)); };
    const modals = [].slice.call(doc.querySelectorAll('.ad-overlay'));
    const top = modals[modals.length - 1];
    const modalTitle = top ? (((top.querySelector('h2') || {}).textContent) || '').replace(/\s+/g, ' ').trim() : null;
    const runnerOpen = has('#runner-overlay', 'show');
    const page = modalTitle ? (modalTitle === '设置' ? 'settings' : 'blockPage') : (runnerOpen ? 'runner' : 'desktop');
    const desktopIcons = [].slice.call(doc.querySelectorAll('.app-card[data-id]')).map(el => ({ id: el.dataset.id, name: (((el.querySelector('h3') || {}).textContent) || '').trim(), icon: (((el.querySelector('.icon') || {}).textContent) || '').trim(), kind: 'app' }))
      .concat([].slice.call(doc.querySelectorAll('.desktop-folder[data-id]')).map(el => ({ id: el.dataset.id, name: (((el.querySelector('.name') || {}).textContent) || '').trim(), kind: 'folder', count: +(((el.querySelector('.count') || {}).textContent) || 0) })));
    const taskbarButtons = [].slice.call(doc.querySelectorAll('.win-taskbar button')).map(b => ({ id: b.id || null, label: ((b.textContent || '').replace(/\s+/g, ' ').trim()).slice(0, 24) })).filter(b => b.id || b.label);
    const openWindows = [].slice.call(doc.querySelectorAll('#win-task-windows button')).map(b => ({ label: ((b.textContent || '').replace(/\s+/g, ' ').trim()).slice(0, 30) }));
    return {
      page, modalTitle,
      startMenuOpen: has('#win-start-menu', 'show'),
      drawerOpen: has('#app-sidebar', 'open'),
      openRunner: runnerOpen ? (runnerAppId || null) : null,
      openWindows, desktopIcons, taskbarButtons,
      wallpaper: ((getComputedStyle(doc.documentElement).getPropertyValue('--shell-wallpaper')) || '').trim() || null,
      hint: '语义骨架(当前界面/桌面图标/开着的窗口)。界面里具体按钮/输入框/坐标用 runtime.snapshot {id:"host"}; 等元素出现用 runtime.waitFor {id:"host",...}'
    };
  }
  /* ── 服务与事件(state=agent 视图定位) ── */
  ctx.provide('ui', {
    modal: mkModal, toast, openRunner, openSettings, state: uiState,
    registerSettingsSection(s) { settingsSections.push(s); },
    registerBlockPage(blockId, open) { blockPages[blockId] = open; },
    openBlockPage,
    topbarSlot() { return $('topbar-slot'); }, // 扩展位: 供任意块向任务栏注入控件(id 沿用 topbar-slot)
    sidebarSlot() { return $('sb-slot'); }, // 扩展位: 供任意块向侧栏 Workspaces 注入条目

  ctx.css('.uied-hud{position:fixed;right:14px;top:14px;z-index:13000;width:248px;max-height:84vh;overflow:auto;background:var(--bg-2,#161616);border:1px solid var(--border,#333);border-radius:12px;padding:12px;box-shadow:0 14px 44px rgba(0,0,0,.55);font-size:12px;display:none}'

      for (const a of Object.keys(uied.appEdits)) for (const s of Object.keys(uied.appEdits[a])) if (Object.keys(uied.appEdits[a][s]).length) rows.push({ st: uied.appEdits[a], s, tag: '[' + a + '] ' + s });
      const o = mkModal('<h2>改动清单</h2>' + (rows.length ? rows.map((r, i) => '<div style="display:flex;gap:8px;align-items:center;margin:6px 0"><code class="uied-tag" style="flex:1">' + esc(r.tag + '{' + Object.entries(r.st[r.s]).map(kv => kv[0] + ':' + kv[1]).join(';') + '}') + '</code><button class="ad-btn-ghost" data-i="' + i + '">删除</button></div>').join('') : '<p class="uied-hint">还没有样式改动。</p>')
        + '<p class="uied-hint">文字改动 ' + uied.texts.length + ' 处: ' + esc(uied.texts.map(t => t.tgtLabel || (t.tgt.kind + ':' + t.tgt.id)).join('、') || '无') + '</p>', true);

      o.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const r = rows[+b.dataset.i]; delete r.st[r.s]; uiedLive(); if (uied.sel) uiedSide(uied.sel); o.remove(); });
    };
  }
  async function openUiEditor(scope) { // 唯一编辑模式: 无参=全局(宿主+一切可及帧, 桌面右键) / scope=应用id(runner ✎)=只编辑该应用, 其余体验全同; 独立态同样可用(各路诚实降级)
    uiedInit(); closeStartMenu(); if (uied) uiedExit(true);
    uied = { scope: scope || null, edits: JSON.parse(JSON.stringify((await ctx.kv.get(SKIN_KEY)) || {})), appEdits: {}, appRec: {}, texts: [], frames: [], sel: null, selPrev: '', selText: '', selEdit: false, selSync: null, selAt: 0, dirty: false, offs: [], liftedFrames: [] };
    document.body.classList.add('uied-on');
    $('uied-title').textContent = scope ? '✎ 编辑 · ' + ((((await apps().get(scope)) || {}).name) || scope) : '✎ 点选编辑';
    $('uied-restore').textContent = '⌫ 清空样式改动'; $('uied-restore').style.display = scope ? 'none' : '';
    if (scope) { const onEsc = e => { if (e.key === 'Escape' && !(uiedHud && uiedHud.contains(e.target))) { e.preventDefault(); if (uied.sel) uiedSelect(null); else $('uied-close').click(); } }; document.addEventListener('keydown', onEsc, true); uied.offs.push(() => document.removeEventListener('keydown', onEsc, true)); } // 作用域模式: 宿主不拦截只留 Esc
    else uiedBindDoc(document);
    const poll = setInterval(uiedScanFrames, 450); uied.offs.push(() => clearInterval(poll)); // 编辑期间轮询补绑帧(新开/重载/解锁后就绪的都靠它)
    await uiedScanFrames();
    uiedLive(); uied.dirty = false; uiedBar(); uiedSelect(null);
  }
  function uiedExit(saved) {
    if (!uied) return;
    const U = uied;
    uiedSelect(null); U.offs.forEach(f => { try { f(); } catch (e) { } }); clearTimeout(U.disarmT);
    if (!saved) U.texts.slice().reverse().forEach(t => { try { t.el.textContent = t.oldText; } catch (e) { } }); // 倒序回滚未保存的文字(宿主/帧同享)
    for (const fr of U.frames) { // 帧内覆盖层归位: 回到已存源码状态(保存过=最新, 放弃=原样)
      if (!fr.appId) continue;
      try { const st = fr.doc.getElementById('petri-ui-edits'); if (st) { const m = U.appRec[fr.appId]; st.textContent = ((ED_RE.exec((m && m.code) || '') || [])[1] || ''); } } catch (e) { }
    }
    applySkin(); // 皮肤单层: 从 kv 重渲染, 未保存的样式预览自然消失
    document.body.classList.remove('uied-on');
    uied = null;
    let n = 0; for (const r of U.liftedFrames) { try { if (r.el.isConnected) { r.el.setAttribute('sandbox', r.sandbox); r.el.srcdoc = r.el.srcdoc; n++; } } catch (e) { } } // 临时解锁的帧: sandbox 逐字节还原+重载
    if (n) toast('编辑时解锁的窗口已恢复隔离');
  }
  async function uiedSave() {
    if (!uied) return;
    uiedSelect(null); // 先路过提交点: 原地改字未落笔的一并收进 texts
    const skin = {}; for (const s of Object.keys(uied.edits)) if (Object.keys(uied.edits[s]).length) skin[s] = uied.edits[s];
    await ctx.kv.set(SKIN_KEY, skin); // 皮肤真身入 kv(#ui-skin 编辑期保持空, live 层继续预览, 退出时还原)
    const jobs = {};
    for (const t of uied.texts) { const k = t.tgt.kind + ':' + t.tgt.id; (jobs[k] = jobs[k] || { tgt: t.tgt, texts: [] }).texts.push(t); }
    for (const aid of Object.keys(uied.appEdits)) { const k = 'app:' + aid; jobs[k] = jobs[k] || { tgt: { kind: 'app', id: aid }, texts: [] }; }
    const blocks = Object.values(jobs).filter(j => j.tgt.kind === 'block');
    if (blocks.length && !confirm('文字改动会写进块源码并重启该块: ' + blocks.map(j => j.tgt.id).join(', ')
      + (blocks.some(j => j.tgt.id === 'petri:agent') ? '\n(注意: agent 重启会清掉当前对话)' : '') + (blocks.some(j => j.tgt.id === ctx.id) ? '\n(含本界面: 保存后整页重载)' : '') + '\n继续?')) return toast('样式已保存; 文字改动还没写入(可继续编辑或 ✕ 放弃)');
    let selfCode = null; const done = [];
    for (const j of Object.values(jobs)) {
      if (j.tgt.kind === 'app') { // 应用: 文字字面 + 样式覆盖层一起落源码; orig 首存一次
        const id = j.tgt.id, rec = await apps().get(id); if (!rec) { toast('应用 ' + id + ' 不在了, 跳过'); continue; }
        let src = j.texts.reduce((z, t) => z.split(t.needle).join(t.repl), rec.code || '');
        const css = skinCss(uied.appEdits[id] || {}), blockCss = css ? '<style id="petri-ui-edits">\n' + css + '\n</style>' : '';
        src = ED_RE.test(src) ? src.replace(ED_RE, () => blockCss)
          : (!blockCss ? src : (/<\/head>/i.test(src) ? src.replace(/<\/head>/i, mm => blockCss + '\n' + mm) : /<\/body>/i.test(src) ? src.replace(/<\/body>/i, mm => blockCss + '\n' + mm) : src + '\n' + blockCss));
        await apps().update(id, { code: src, orig: rec.orig || rec.code });
        try { uied.appRec[id] = await apps().get(id); } catch (e) { }
        done.push('应用 ' + (rec.name || id));
      } else { // 块(含块窗文字): 统一写路径 — code 在岗带解析对齐, 否则直存热替换; 本块自改=最后存+整页重载
        const bid = j.tgt.id, b = ctx.stem.getBlock(bid); if (!b) { toast('块 ' + bid + ' 不见了, 跳过'); continue; }
        let code = b.code; for (const t of j.texts) code = code.split(t.needle).join(t.repl);
        if (bid === ctx.id) { selfCode = code; continue; }
        try {
          const h = ctx.sdk && ctx.sdk.handlers && ctx.sdk.handlers['code.updateMiniapp'];
          if (h && !h.stream) await (typeof h === 'function' ? h : h.fn)({ id: 'block:' + bid, patch: { code } }, { context: {} });
          else { await ctx.stem.saveBlock(bid, code); ctx.emit('blocks:changed'); }
          done.push('块 ' + bid);
        } catch (e) { toast('块 ' + bid + ' 未写入: ' + (e && e.message)); } // 独立态 saveBlock 如实拒绝/任何写失败: 不中断其余保存
      }
    }
    uied.texts = []; uied.dirty = false; uiedBar();
    if (selfCode != null) { toast('保存中, 本界面源码已改, 整页重载…'); return ctx.stem.saveBlock(ctx.id, selfCode).then(() => location.reload()).catch(e => toast('本界面保存失败: ' + (e && e.message))); }
    toast('已保存: 样式 ' + Object.keys(skin).length + ' 条' + (done.length ? ' + ' + done.join('、') : ''));
  }
  async function uiedRestore() {
    if (!uied) return;
    if (!confirm('清空所有改过的样式(颜色/字号等)? 文字类改动不受影响。')) return;
    await ctx.kv.del(SKIN_KEY); uied.edits = {}; uiedLive(); uied.dirty = false; uiedBar(); if (uied.sel) uiedSide(uied.sel);
    toast('样式改动已清空');
  }
  if (ctx.kv) ctx.kv.get('skill:petri:ui-shell:机制-点选编辑与全局皮肤').then(v => { const val = { v: 5, seededBy: 'petri:ui-shell',
    desc: '用户提到点选编辑/改界面样式/皮肤, 或对话里出现[界面元素]卡片时读',
    guide: '入口两个, 同一编辑器: 桌面右键 ✎ 编辑界面=全局(宿主+一切帧, 点到隔离帧临时解锁, 退出恢复, 绝不落 trust) / 运行中应用顶栏 ✎ 编辑=只限该应用。加一击: 第一击选中, 已选中再点=原本功能(双击类=先选中再双击; 放行连击停 1.2s 自动取消选中)。文字元素选中即可原地打字或用面板文字框(双向同步), 回车/换选提交。改动归宿: 宿主样式→write kv:settings:ui.skin, 值必须是对象 {"#选择器":{"css属性":"值"}}(不是 CSS 文本!), 再 run call:ui.applySkin 立即生效; 应用样式/文字→应用源码(petri-ui-edits 覆盖层/字面, orig 首存); 块与块自带窗的文字→块源码字面(edit block:<id>); 块自带窗样式→改该块源码。独立态(单文件)同样可编辑: 皮肤落本地存储, 源码类保存如实拒绝。[界面元素]卡片(长按未选中元素/📮发来)只含事实: 选择器/归属/文字/盒模型 — 怎么改按上面归宿选通道; 看/点该元素用 runtime.snapshot/click({id:"host"} 或 {id:"<miniappId>"}) 配卡片选择器。' };
    if (!v || v.v !== val.v) ctx.kv.set('skill:petri:ui-shell:机制-点选编辑与全局皮肤', val); }).catch(() => { }); // 知识随块: 编辑器与皮肤的说明书由本块自种(值形状示例原随卡片指南, 卡片瘦身后归此 — R1 实测缺了就写错)

  applyWallpaper();
  renderApps();
  renderTiles();
  return { api: { openRunner, openBlockPage }, dispose() { try { uiedExit(true); } catch (e) { } closeRunner(); if (typeof voxDispose === 'function') voxDispose(); } }; // 编辑模式的 document 级捕获监听必须随块退场, 否则热重启后旧监听吃掉整页点击
})
</script>
